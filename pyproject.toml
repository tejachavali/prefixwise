[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefixwise"
version = "0.3.1"
description = "Name why your LLM prompt cache missed, price the miss, and measure tokens per successful task. A local proxy and CLI for OpenAI, Anthropic and vLLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Teja Chavali"}]
keywords = ["llm", "prompt-caching", "kv-cache", "agents", "token-efficiency", "openai", "anthropic", "vllm", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
# Runtime: standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/tejachavali/prefixwise"
Issues = "https://github.com/tejachavali/prefixwise/issues"

[project.scripts]
prefixwise = "prefixwise.cli:main"
prefixwise-proxy = "prefixwise.proxy:serve"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/prefixwise"]

[tool.hatch.build.targets.sdist]
# Source, tests and what the tests read; not CI config or project logs.
include = ["src", "tests", "experiments", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "pyproject.toml"]
exclude = ["experiments/*/results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
