[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "prefixwise"
version = "0.10.1"
description = "Name why your LLM prompt cache missed, price the miss, and measure tokens per successful task. A local proxy and CLI for OpenAI, Anthropic and vLLM."
dynamic = ["readme"]  # README.md with its relative links made absolute for PyPI (below)
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Teja Chavali"}]
keywords = ["llm", "prompt-caching", "kv-cache", "agents", "token-efficiency", "openai", "anthropic", "vllm", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
# Runtime: standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/tejachavali/prefixwise"
Documentation = "https://github.com/tejachavali/prefixwise/tree/main/docs"
Changelog = "https://github.com/tejachavali/prefixwise/blob/main/CHANGELOG.md"
Issues = "https://github.com/tejachavali/prefixwise/issues"

[project.scripts]
prefixwise = "prefixwise.cli:main"
prefixwise-proxy = "prefixwise.proxy:serve"

[project.entry-points.pytest11]
prefixwise = "prefixwise.pytest_plugin"  # names each test to `prefixwise check`; inert otherwise

[project.optional-dependencies]
engines = ["pyzmq>=25", "msgspec>=0.18"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
log = ["redis>=5"]
dev = ["pytest", "pyzmq>=25", "msgspec>=0.18", "prometheus-client", "openai", "anthropic", "litellm[mcp]", "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30", "redis>=5"]

# PyPI shows README.md as the project page. Its links are relative to the repository (docs/, experiments/,
# benchmarks/, the top-level .md files), which PyPI cannot resolve, so the build rewrites them to GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{path = "README.md"}]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:docs|experiments|benchmarks|examples|deploy|src|tests)/[^)\s]*)\)'
replacement = '](https://github.com/tejachavali/prefixwise/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:SECURITY|CONTRIBUTING|CHANGELOG|LICENSE|WORKLOG)\.md)\)'
replacement = '](https://github.com/tejachavali/prefixwise/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#([^)]+)\)'
replacement = '](https://github.com/tejachavali/prefixwise#\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/prefixwise"]

[tool.hatch.build.targets.sdist]
# Source, tests and what the tests read; not CI config or project logs.
include = ["src", "tests", "experiments", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "pyproject.toml"]
exclude = ["experiments/*/results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
