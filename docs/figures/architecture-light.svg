<svg xmlns="http://www.w3.org/2000/svg" width="940" height="800" viewBox="0 0 940 800" role="img" aria-label="How a request flows through Prefixwise: four ways in; read, forward (proxy only), fingerprint and name one cause; the response back with the verdict in headers; agent logs through their own rules; one ledger row; Prometheus and OpenTelemetry live, report, API and export from the ledger" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How a request flows through Prefixwise: four ways in; read, forward (proxy only), fingerprint and name one cause; the response back with the verdict in headers; agent logs through their own rules; one ledger row; Prometheus and OpenTelemetry live, report, API and export from the ledger</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="940" height="800" rx="8" fill="#fcfcfb"/><text x="470.0" y="34.0" fill="#0b0b0b" font-size="17" text-anchor="middle" font-weight="600">How a request flows through Prefixwise</text><text x="470.0" y="56.0" fill="#898781" font-size="12.5" text-anchor="middle" font-weight="400">Four ways in, one row per request; the prompt itself is never stored</text><rect x="20" y="74" width="900" height="112" rx="12" fill="none" stroke="#e1e0d9" stroke-width="1.5"/><text x="34.0" y="96.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600">WAYS IN</text><rect x="40" y="104" width="194" height="66" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="137.0" y="124.5" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">Your agent</text><text x="137.0" y="141.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">through the proxy</text><text x="137.0" y="158.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">prefixwise serve / run</text><rect x="262" y="104" width="194" height="66" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="359.0" y="124.5" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">Your own code</text><text x="359.0" y="141.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">prefixwise.wrap(client)</text><text x="359.0" y="158.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">Anthropic / OpenAI SDKs</text><rect x="484" y="104" width="194" height="66" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="581.0" y="124.5" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">LiteLLM</text><text x="581.0" y="141.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">PrefixwiseCallback</text><text x="581.0" y="158.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">SDK or proxy server</text><rect x="706" y="104" width="194" height="66" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="803.0" y="124.5" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">Agent logs</text><text x="803.0" y="141.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">prefixwise import</text><text x="803.0" y="158.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">Claude Code, Codex</text><rect x="20" y="204" width="900" height="356" rx="12" fill="none" stroke="#e1e0d9" stroke-width="1.5"/><text x="906.0" y="226.0" fill="#898781" font-size="12" text-anchor="end" font-weight="600">PREFIXWISE</text><rect x="250" y="234" width="440" height="58" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="470.0" y="259.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">1  Read the request</text><text x="470.0" y="276.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">session, agent, task; diagnostic fields added</text><rect x="250" y="318" width="440" height="58" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="470.0" y="343.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">2  Forward it (proxy only)</text><text x="470.0" y="360.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">the client's request and auth, as sent</text><rect x="250" y="402" width="440" height="58" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="470.0" y="427.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">3  Fingerprint the prompt</text><text x="470.0" y="444.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">blocks in cache order, hashed: never the text</text><rect x="250" y="486" width="440" height="58" rx="8" fill="#f5f8ff" stroke="#2563eb" stroke-width="1.6"/><text x="470.0" y="511.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">4  Name one cause</text><text x="470.0" y="528.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">against this thread's previous turn; sub-reason; price</text><path d="M470.0,292.0 L470.0,316.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M470.0,376.0 L470.0,400.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M470.0,460.0 L470.0,484.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M150.0,170.0 L150.0,252.0 L248.0,252.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M359.0,170.0 L359.0,194.0 L222.0,194.0 L222.0,276.0 L248.0,276.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M581.0,170.0 L581.0,194.0 L359.0,194.0" fill="none" stroke="#52514e" stroke-width="1.4"/><text x="214.0" y="300.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">wrap / LiteLLM:</text><text x="214.0" y="315.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">already sent, so</text><text x="214.0" y="330.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">recorded, not forwarded</text><path d="M248.0,528.0 L60.0,528.0 L60.0,172.0" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="70.0" y="470.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">response, unchanged,</text><text x="70.0" y="485.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">with the verdict in</text><text x="70.0" y="500.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">X-Prefixwise-* headers</text><rect x="744" y="315" width="160" height="64" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="824.0" y="334.5" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">Provider or engine</text><text x="824.0" y="351.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">Anthropic, OpenAI,</text><text x="824.0" y="368.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">vLLM, SGLang</text><path d="M690.0,334.0 L742.0,334.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><text x="717.0" y="327.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">request</text><path d="M742.0,362.0 L692.0,362.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><text x="717.0" y="378.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">response</text><rect x="744" y="486" width="160" height="58" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="5 4"/><text x="824.0" y="511.0" fill="#0b0b0b" font-size="12" text-anchor="middle" font-weight="600">KV-cache events</text><text x="824.0" y="528.0" fill="#52514e" font-size="12" text-anchor="middle" font-weight="400">vLLM / SGLang, optional</text><path d="M742.0,503.0 L692.0,503.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><rect x="744.9" y="551.5" width="158.1" height="17.5" rx="4" fill="#fcfcfb"/><text x="824.0" y="563.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">evicted? which replica?</text><rect x="690" y="584" width="200" height="64" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="790.0" y="603.5" fill="#0b0b0b" font-size="12" text-anchor="middle" font-weight="600">Log rules</text><text x="790.0" y="620.5" fill="#52514e" font-size="12" text-anchor="middle" font-weight="400">what the log shows changed:</text><text x="790.0" y="637.5" fill="#52514e" font-size="12" text-anchor="middle" font-weight="400">model, compaction, TTL, ...</text><path d="M803.0,170.0 L803.0,194.0 L912.0,194.0 L912.0,616.0 L892.0,616.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M688.0,616.0 L562.0,616.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M380,593 V639 A90.0,9 0 0 0 560,639 V593" fill="#f5f8ff" stroke="#2563eb" stroke-width="1.6"/><ellipse cx="470.0" cy="593" rx="90.0" ry="9" fill="#f5f8ff" stroke="#2563eb" stroke-width="1.6"/><text x="470.0" y="616.5" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">Ledger</text><text x="470.0" y="633.5" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="400">SQLite, one row per request</text><path d="M470.0,544.0 L470.0,582.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="690" width="900" height="92" rx="12" fill="none" stroke="#e1e0d9" stroke-width="1.5"/><text x="34.0" y="712.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600">WAYS OUT</text><rect x="30.0" y="718" width="168" height="44" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="114.0" y="744.5" fill="#0b0b0b" font-size="12.5" text-anchor="middle" font-weight="600">Prometheus /metrics</text><rect x="208.0" y="718" width="168" height="44" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="292.0" y="744.5" fill="#0b0b0b" font-size="12.5" text-anchor="middle" font-weight="600">OpenTelemetry spans</text><rect x="386.0" y="718" width="168" height="44" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="470.0" y="744.5" fill="#0b0b0b" font-size="12.5" text-anchor="middle" font-weight="600">prefixwise report</text><rect x="564.0" y="718" width="168" height="44" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="648.0" y="744.5" fill="#0b0b0b" font-size="12.5" text-anchor="middle" font-weight="600">HTTP API /api/v1</text><rect x="742.0" y="718" width="168" height="44" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/><text x="826.0" y="744.5" fill="#0b0b0b" font-size="12.5" text-anchor="middle" font-weight="600">prefixwise export</text><path d="M300,546 V672 M114.0,672 H292.0" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M114.0,672.0 L114.0,716.0" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M292.0,672.0 L292.0,716.0" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="292.0" y="600.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">live, as each</text><text x="292.0" y="615.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">row is recorded</text><path d="M470.0,650 V672 M470.0,672 H826.0" fill="none" stroke="#52514e" stroke-width="1.4"/><path d="M470.0,672.0 L470.0,716.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M648.0,672.0 L648.0,716.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><path d="M826.0,672.0 L826.0,716.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/><rect x="653.0" y="654.5" width="138.8" height="17.5" rx="4" fill="#fcfcfb"/><text x="658.0" y="666.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">read from the ledger</text></svg>
