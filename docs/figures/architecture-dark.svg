<svg xmlns="http://www.w3.org/2000/svg" width="940" height="854" viewBox="0 0 940 854" role="img" aria-label="How a request flows through Prefixwise: four ways in; an edge reads, forwards (proxy only) and fingerprints the request where it is; a turn record (hashes, counts, usage, never text) crosses to a collector, in one process or over HTTP or a Redis Stream partitioned by session, which names one cause and writes one ledger row; the response back with the verdict in headers; the engine's KV-cache events joined at the edge; agent logs through their own rules into their own ledger file; OpenTelemetry spans live from the edge, Prometheus live from the collector's rows, report, API and export from the ledger, sinks a copy of every row" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How a request flows through Prefixwise: four ways in; an edge reads, forwards (proxy only) and fingerprints the request where it is; a turn record (hashes, counts, usage, never text) crosses to a collector, in one process or over HTTP or a Redis Stream partitioned by session, which names one cause and writes one ledger row; the response back with the verdict in headers; the engine's KV-cache events joined at the edge; agent logs through their own rules into their own ledger file; OpenTelemetry spans live from the edge, Prometheus live from the collector's rows, report, API and export from the ledger, sinks a copy of every row</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="940" height="854" rx="8" fill="#1a1a19"/><text x="470.0" y="34.0" fill="#f0efec" font-size="17" text-anchor="middle" font-weight="600">How a request flows through Prefixwise</text><text x="470.0" y="56.0" fill="#898781" font-size="12.5" text-anchor="middle" font-weight="400">An edge where the request is, a collector where the ledger is; one process or many; the prompt itself is never stored</text><rect x="20" y="74" width="900" height="112" rx="12" fill="none" stroke="#2c2c2a" stroke-width="1.5"/><text x="34.0" y="96.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600">WAYS IN</text><rect x="40" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="137.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Your agent</text><text x="137.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">through the proxy</text><text x="137.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">prefixwise serve / run</text><rect x="262" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="359.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Your own code</text><text x="359.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">prefixwise.wrap(client)</text><text x="359.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">Anthropic / OpenAI SDKs</text><rect x="484" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="581.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">LiteLLM</text><text x="581.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">PrefixwiseCallback</text><text x="581.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">SDK or proxy server</text><rect x="706" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="803.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Agent logs</text><text x="803.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">prefixwise import</text><text x="803.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">Claude Code, Codex</text><rect x="20" y="204" width="900" height="272" rx="12" fill="none" stroke="#2c2c2a" stroke-width="1.5"/><text x="906.0" y="226.0" fill="#898781" font-size="12" text-anchor="end" font-weight="600">EDGE: where the request is</text><rect x="250" y="234" width="440" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="470.0" y="259.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">1  Read the request</text><text x="470.0" y="276.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">session, agent, task; diagnostic fields added</text><rect x="250" y="318" width="440" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="470.0" y="343.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">2  Forward it (proxy only)</text><text x="470.0" y="360.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">the client's request and auth, as sent</text><rect x="250" y="402" width="440" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="470.0" y="427.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">3  Fingerprint the prompt</text><text x="470.0" y="444.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">blocks in cache order, hashed: never the text</text><rect x="250" y="540" width="440" height="58" rx="8" fill="#18202f" stroke="#3b82f6" stroke-width="1.6"/><text x="470.0" y="565.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">4  Name one cause</text><text x="470.0" y="582.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">against this conversation's previous turn; sub-reason; price</text><path d="M470.0,292.0 L470.0,316.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M470.0,376.0 L470.0,400.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M470.0,460.0 L470.0,538.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="482.0" y="486.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">turn record: block hashes, positions, counts, usage; never the text</text><text x="482.0" y="500.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">one process: a call. A fleet: HTTP to prefixwise collect, or a Redis</text><text x="482.0" y="514.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">Stream partitioned by session, each partition read by one collector</text><rect x="20" y="520" width="900" height="216" rx="12" fill="none" stroke="#2c2c2a" stroke-width="1.5"/><text x="34.0" y="542.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600"></text><text x="66.0" y="536.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600">COLLECTOR: one per fleet, or one per set of log partitions</text><path d="M150.0,170.0 L150.0,252.0 L248.0,252.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M359.0,170.0 L359.0,194.0 L222.0,194.0 L222.0,276.0 L248.0,276.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M581.0,170.0 L581.0,194.0 L359.0,194.0" fill="none" stroke="#c3c2b7" stroke-width="1.4"/><text x="214.0" y="300.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">wrap / LiteLLM:</text><text x="214.0" y="315.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">already sent, so</text><text x="214.0" y="330.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">recorded, not forwarded</text><path d="M248.0,582.0 L46.0,582.0 L46.0,172.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="70.0" y="392.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">response, unchanged,</text><text x="70.0" y="407.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">with the verdict in</text><text x="70.0" y="422.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">X-Prefixwise-* headers</text><text x="70.0" y="437.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">(one process;</text><text x="70.0" y="452.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">an edge says: queued)</text><rect x="744" y="315" width="160" height="64" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="824.0" y="334.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Provider or engine</text><text x="824.0" y="351.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">Anthropic, OpenAI,</text><text x="824.0" y="368.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">vLLM, SGLang</text><path d="M690.0,334.0 L742.0,334.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="717.0" y="327.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">request</text><path d="M742.0,362.0 L692.0,362.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="717.0" y="378.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">response</text><rect x="744" y="398" width="160" height="62" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2" stroke-dasharray="5 4"/><text x="824.0" y="416.5" fill="#f0efec" font-size="12" text-anchor="middle" font-weight="600">KV-cache events</text><text x="824.0" y="433.5" fill="#c3c2b7" font-size="12" text-anchor="middle" font-weight="400">vLLM / SGLang, optional:</text><text x="824.0" y="450.5" fill="#c3c2b7" font-size="12" text-anchor="middle" font-weight="400">evicted? which replica?</text><path d="M742.0,431.0 L692.0,431.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><rect x="690" y="638" width="200" height="64" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="790.0" y="657.5" fill="#f0efec" font-size="12" text-anchor="middle" font-weight="600">Log rules, own ledger file</text><text x="790.0" y="674.5" fill="#c3c2b7" font-size="12" text-anchor="middle" font-weight="400">what the log shows changed:</text><text x="790.0" y="691.5" fill="#c3c2b7" font-size="12" text-anchor="middle" font-weight="400">model, compaction, TTL, ...</text><path d="M803.0,170.0 L803.0,194.0 L912.0,194.0 L912.0,670.0 L892.0,670.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M688.0,670.0 L562.0,670.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M380,647 V693 A90.0,9 0 0 0 560,693 V647" fill="#18202f" stroke="#3b82f6" stroke-width="1.6"/><ellipse cx="470.0" cy="647" rx="90.0" ry="9" fill="#18202f" stroke="#3b82f6" stroke-width="1.6"/><text x="470.0" y="670.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Ledger</text><text x="470.0" y="687.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="400">SQLite, one row per request</text><path d="M470.0,598.0 L470.0,636.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><rect x="20" y="744" width="900" height="92" rx="12" fill="none" stroke="#2c2c2a" stroke-width="1.5"/><text x="470.0" y="766.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="600">WAYS OUT</text><rect x="25.0" y="772" width="140" height="44" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="95.0" y="790.0" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">OpenTelemetry</text><text x="95.0" y="807.0" fill="#c3c2b7" font-size="12.5" text-anchor="middle" font-weight="400">spans</text><rect x="175.0" y="772" width="140" height="44" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="245.0" y="790.0" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Prometheus</text><text x="245.0" y="807.0" fill="#c3c2b7" font-size="12.5" text-anchor="middle" font-weight="400">/metrics</text><rect x="325.0" y="772" width="140" height="44" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="395.0" y="790.0" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">prefixwise</text><text x="395.0" y="807.0" fill="#c3c2b7" font-size="12.5" text-anchor="middle" font-weight="400">report</text><rect x="475.0" y="772" width="140" height="44" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="545.0" y="790.0" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">HTTP API</text><text x="545.0" y="807.0" fill="#c3c2b7" font-size="12.5" text-anchor="middle" font-weight="400">/api/v1</text><rect x="625.0" y="772" width="140" height="44" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="695.0" y="790.0" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">prefixwise</text><text x="695.0" y="807.0" fill="#c3c2b7" font-size="12.5" text-anchor="middle" font-weight="400">export</text><rect x="775.0" y="772" width="140" height="44" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="845.0" y="790.0" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Sinks: JSONL,</text><text x="845.0" y="807.0" fill="#c3c2b7" font-size="12.5" text-anchor="middle" font-weight="400">ClickHouse</text><path d="M300,598 V726 H245.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M245.0,726.0 L245.0,770.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="308.0" y="606.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">rows, live, from the collector</text><path d="M248,431 H236 V470 H32 V726 H95.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M95.0,726.0 L95.0,770.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="40.0" y="650.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">spans, live,</text><text x="40.0" y="665.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">from the edge</text><path d="M470.0,704 V726 M395.0,726 H845.0" fill="none" stroke="#c3c2b7" stroke-width="1.4"/><path d="M395.0,726.0 L395.0,770.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M545.0,726.0 L545.0,770.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M695.0,726.0 L695.0,770.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M845.0,726.0 L845.0,770.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><rect x="550.0" y="708.5" width="338.4" height="17.5" rx="4" fill="#1a1a19"/><text x="555.0" y="720.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">read from the ledger; sinks get a copy of every row</text></svg>
