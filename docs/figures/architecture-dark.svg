<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" role="img" aria-label="How a request flows through Prefixwise: four ways in, read, forward, fingerprint and classify, one ledger, and five ways out" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How a request flows through Prefixwise: four ways in, read, forward, fingerprint and classify, one ledger, and five ways out</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="940" height="760" rx="8" fill="#1a1a19"/><text x="470.0" y="34.0" fill="#f0efec" font-size="17" text-anchor="middle" font-weight="600">How a request flows through Prefixwise</text><text x="470.0" y="56.0" fill="#898781" font-size="12.5" text-anchor="middle" font-weight="400">Four ways in, one classifier, one ledger; every number you see is read from the ledger</text><rect x="20" y="74" width="900" height="112" rx="12" fill="none" stroke="#2c2c2a" stroke-width="1.5"/><text x="34.0" y="96.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600">WAYS IN</text><rect x="40" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="137.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Your agent</text><text x="137.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">through the proxy</text><text x="137.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">prefixwise serve / run</text><rect x="262" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="359.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Your own code</text><text x="359.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">prefixwise.wrap(client)</text><text x="359.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">Anthropic / OpenAI SDKs</text><rect x="484" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="581.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">LiteLLM</text><text x="581.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">PrefixwiseCallback</text><text x="581.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">SDK or proxy server</text><rect x="706" y="104" width="194" height="66" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="803.0" y="124.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Agent logs</text><text x="803.0" y="141.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">prefixwise import</text><text x="803.0" y="158.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">Claude Code, Codex</text><rect x="20" y="204" width="900" height="356" rx="12" fill="none" stroke="#2c2c2a" stroke-width="1.5"/><text x="34.0" y="226.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600">PREFIXWISE</text><rect x="250" y="234" width="440" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="470.0" y="259.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">1  Read the request</text><text x="470.0" y="276.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">session, agent, task; add diagnostic fields</text><rect x="250" y="318" width="440" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="470.0" y="343.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">2  Forward, relay the response</text><text x="470.0" y="360.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">unchanged, plus X-Prefixwise-* verdict headers</text><rect x="250" y="402" width="440" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="470.0" y="427.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">3  Fingerprint the prompt</text><text x="470.0" y="444.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">blocks in cache order, hashed: never the text</text><rect x="250" y="486" width="440" height="58" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="470.0" y="511.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">4  Name one cause</text><text x="470.0" y="528.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">compare with the previous turn; sub-reason; price</text><path d="M470.0,292.0 L470.0,316.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M470.0,376.0 L470.0,400.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M470.0,460.0 L470.0,484.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M137.0,170.0 L137.0,263.0 L248.0,263.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M359.0,170.0 L359.0,196.0 L220.0,196.0 L220.0,431.0 L248.0,431.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="214.0" y="452.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">the call already happened</text><path d="M581.0,170.0 L581.0,196.0 L220.0,196.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><rect x="724" y="315" width="180" height="64" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="814.0" y="334.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Provider or engine</text><text x="814.0" y="351.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">Anthropic, OpenAI,</text><text x="814.0" y="368.5" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">vLLM, SGLang</text><path d="M690.0,334.0 L722.0,334.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="707.0" y="328.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">request</text><path d="M722.0,362.0 L692.0,362.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="707.0" y="378.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">response</text><rect x="724" y="486" width="180" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2" stroke-dasharray="5 4"/><text x="814.0" y="511.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">KV-cache events</text><text x="814.0" y="528.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">vLLM / SGLang (optional)</text><path d="M722.0,515.0 L692.0,515.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="812.0" y="562.0" fill="#898781" font-size="11.5" text-anchor="middle" font-weight="400">evicted? which replica?</text><rect x="40" y="486" width="170" height="58" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2" stroke-dasharray="5 4"/><text x="125.0" y="511.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Provider's own reason</text><text x="125.0" y="528.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">Anthropic / OpenAI</text><path d="M212.0,515.0 L248.0,515.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M380,593 V639 A90.0,9 0 0 0 560,639 V593" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><ellipse cx="470.0" cy="593" rx="90.0" ry="9" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="470.0" y="616.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">Ledger</text><text x="470.0" y="633.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="400">SQLite, one row per request</text><path d="M470.0,544.0 L470.0,582.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><path d="M803.0,170.0 L803.0,196.0 L912.0,196.0 L912.0,616.0 L562.0,616.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="906.0" y="604.0" fill="#898781" font-size="11.5" text-anchor="end" font-weight="400">usage from the logs</text><rect x="20" y="668" width="900" height="76" rx="12" fill="none" stroke="#2c2c2a" stroke-width="1.5"/><text x="34.0" y="690.0" fill="#898781" font-size="12" text-anchor="start" font-weight="600">WAYS OUT</text><rect x="30.0" y="692" width="168" height="40" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="114.0" y="716.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="600">prefixwise report</text><rect x="208.0" y="692" width="168" height="40" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="292.0" y="716.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="600">HTTP API /api/v1</text><rect x="386.0" y="692" width="168" height="40" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="470.0" y="716.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="600">Prometheus /metrics</text><rect x="564.0" y="692" width="168" height="40" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="648.0" y="716.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="600">OpenTelemetry spans</text><rect x="742.0" y="692" width="168" height="40" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="826.0" y="716.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="600">prefixwise export</text><path d="M470.0,648.0 L470.0,690.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/></svg>
