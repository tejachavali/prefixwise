<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1178" viewBox="0 0 940 1178" role="img" aria-label="How Prefixwise names a cache miss: a flowchart of the classifier's rules, in order" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How Prefixwise names a cache miss: a flowchart of the classifier's rules, in order</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker></defs><rect width="940" height="1178" rx="8" fill="#1a1a19"/><text x="470.0" y="34.0" fill="#f0efec" font-size="17" text-anchor="middle" font-weight="600">How Prefixwise names a cache miss</text><text x="470.0" y="56.0" fill="#898781" font-size="12.5" text-anchor="middle" font-weight="400">Each request is compared with the previous one to the same model in the same session. The first rule that fires wins.</text><rect x="65" y="82" width="330" height="46" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="230.0" y="101.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">A request and its response</text><text x="230.0" y="118.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">plus the previous turn</text><path d="M230.0,128.0 L230.0,148.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><polygon points="230,150.0 395.0,187.0 230,224.0 65.0,187.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="183.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">First turn? Another model?</text><text x="230.0" y="199.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Previous turn too short to cache?</text><rect x="470" y="159.0" width="440" height="56" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="183.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">first_write · fork_boundary · model_switch</text><text x="690.0" y="200.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">below_min_prefix: nothing could be reused yet</text><path d="M395.0,187.0 L468.0,187.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="180.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,224.0 L230.0,248.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="239.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,250.0 395.0,287.0 230,324.0 65.0,287.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="283.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Did a part of the prompt change?</text><text x="230.0" y="299.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">(system, tools, messages, tool results)</text><rect x="470" y="242.0" width="440" height="90" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="266.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">The first changed part names it</text><text x="690.0" y="283.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">volatile_system · system_edit · tool_reserialize</text><text x="690.0" y="300.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">tool_catalog_change · history_edit · tool_result_mutation</text><text x="690.0" y="317.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">compaction_rewrite</text><path d="M395.0,287.0 L468.0,287.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="280.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,324.0 L230.0,348.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="339.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,350.0 395.0,387.0 230,424.0 65.0,387.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="383.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">A setting, the size or</text><text x="230.0" y="399.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">a cache breakpoint?</text><rect x="470" y="367.5" width="440" height="39" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="391.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">param_rendered · below_min_prefix · breakpoint_misplaced</text><path d="M395.0,387.0 L468.0,387.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="380.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,424.0 L230.0,448.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="439.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,450.0 395.0,487.0 230,524.0 65.0,487.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="483.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Was the prefix read</text><text x="230.0" y="499.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">from the cache?</text><rect x="470" y="467.5" width="440" height="39" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="491.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">none: a hit</text><path d="M395.0,487.0 L468.0,487.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="480.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,524.0 L230.0,548.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="539.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,550.0 395.0,587.0 230,624.0 65.0,587.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="583.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Do KV events show an eviction</text><text x="230.0" y="599.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">or a request sent to another cache?</text><rect x="470" y="559.0" width="440" height="56" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="583.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">evicted · routing_miss</text><text x="690.0" y="600.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">confirmed (vLLM / SGLang with --kv-events)</text><path d="M395.0,587.0 L468.0,587.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="580.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,624.0 L230.0,648.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="639.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,650.0 395.0,687.0 230,724.0 65.0,687.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="683.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">The same request again</text><text x="230.0" y="699.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">within a minute?</text><rect x="470" y="667.5" width="440" height="39" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="691.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">retry_replay</text><path d="M395.0,687.0 L468.0,687.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="680.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,724.0 L230.0,748.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="739.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,750.0 395.0,787.0 230,824.0 65.0,787.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="783.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Behind a self-hosted engine</text><text x="230.0" y="799.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">(--engine vllm / sglang)?</text><rect x="470" y="759.0" width="440" height="56" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="783.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">evicted, inferred (one cache, no event evidence)</text><text x="690.0" y="800.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">otherwise unknown, saying why</text><path d="M395.0,787.0 L468.0,787.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="780.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,824.0 L230.0,848.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="839.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,850.0 395.0,887.0 230,924.0 65.0,887.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="883.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Longer gap than the</text><text x="230.0" y="899.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">cache keeps entries?</text><rect x="470" y="859.0" width="440" height="56" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="883.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">ttl_expired</text><text x="690.0" y="900.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">the entry expired</text><path d="M395.0,887.0 L468.0,887.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="880.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,924.0 L230.0,948.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="939.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><polygon points="230,950.0 395.0,987.0 230,1024.0 65.0,987.0" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="230.0" y="983.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">Nothing read, and</text><text x="230.0" y="999.5" fill="#f0efec" font-size="12.5" text-anchor="middle" font-weight="400">within that time?</text><rect x="470" y="967.5" width="440" height="39" rx="8" fill="#1a1a19" stroke="#3987e5" stroke-width="1.6"/><text x="690.0" y="991.5" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">routing_miss</text><path d="M395.0,987.0 L468.0,987.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="407.0" y="980.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">yes</text><path d="M230.0,1024.0 L230.0,1048.0" fill="none" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#a)"/><text x="238.0" y="1039.0" fill="#898781" font-size="11.5" text-anchor="start" font-weight="400">no</text><rect x="65" y="1050" width="330" height="52" rx="8" fill="#1a1a19" stroke="#383835" stroke-width="1.2"/><text x="230.0" y="1072.0" fill="#f0efec" font-size="13" text-anchor="middle" font-weight="600">unknown</text><text x="230.0" y="1089.0" fill="#c3c2b7" font-size="13" text-anchor="middle" font-weight="400">with the evidence that was missing: never a guess</text><text x="470.0" y="1132.0" fill="#898781" font-size="12.5" text-anchor="middle" font-weight="400">Then, for every verdict: a sub-reason where the evidence allows, waste or expected,</text><text x="470.0" y="1150.0" fill="#898781" font-size="12.5" text-anchor="middle" font-weight="400">the avoidable tokens and their price, and one row in the ledger</text></svg>
