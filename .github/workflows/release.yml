name: Release

# Publishes to PyPI, then creates the GitHub Release, when a version tag is pushed
# (git tag v0.3.0 && git push origin v0.3.0). Only full versions: the moving `v0.10` tag that
# `uses: tejachavali/prefixwise@v0.10` resolves (action.yml) is not a release.
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere. One-time setup
# on pypi.org is described in CONTRIBUTING.md ("Releasing").

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$version" || { echo "tag v$tag does not match pyproject version $version"; exit 1; }
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub Release, from the CHANGELOG section of this version, with the same files PyPI got,
  # so the repository's Releases page never lags PyPI. Runs only after PyPI accepted them.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release; nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" -f .github/release-notes.awk CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Create the release (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo "release exists"; exit 0; }
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
