name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests -q
      - name: Failure-handling benchmark (upstream faults, bad clients, idle sockets)
        run: python benchmarks/bench.py --quick --only faults --out "$RUNNER_TEMP/bench"
      - name: E1-open mock smoke test
        run: python experiments/e1_open/e1_open.py --mock --output-dir "$RUNNER_TEMP/e1"
      - name: CLI smoke test
        run: |
          prefixwise --version
          prefixwise serve --mock --port 8080 --ledger "$RUNNER_TEMP/l.db" &
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -X POST localhost:8080/v1/chat/completions -H 'Content-Type: application/json' \
            -H 'X-Prefixwise-Task-Id: ci' -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}' > /dev/null
          prefixwise task ci --success --ledger "$RUNNER_TEMP/l.db"
          prefixwise report --ledger "$RUNNER_TEMP/l.db"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prefixwise .
      - run: |
          docker run -d --name pw -p 8080:8080 prefixwise
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          docker exec pw python -m prefixwise report
      - name: docker stop is graceful (SIGTERM handled as PID 1, exit 0 not 137)
        run: |
          docker stop -t 10 pw
          code=$(docker inspect -f '{{.State.ExitCode}}' pw)
          echo "exit code $code"; test "$code" = 0
